[package]
name = "cfs-bin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sandboxfs"
path = "src/main.rs"

[dependencies]
backend = { path = "../crates/backend" }
sandboxd = { path = "../crates/sandboxd" }
cfs = { git = "ssh://git@github.com/aspect-build/cfs.git", branch = "main" }

# Its own workspace root, deliberately: the parent resolves every member's dependencies whether
# or not a feature enables them, so a `cfs` dep declared over there would make an ordinary
# sandboxfs build reach for the private repo. Kept out here, only this manifest ever fetches it.
[workspace]

# `cfs` pulls `backend` from the sandboxfs repo over git. Without this patch that is a second,
# distinct copy of the crate and its `dyn Backend` will not unify with the one linked here.
[patch."ssh://git@github.com/aspect-build/sandboxfs.git"]
backend = { path = "../crates/backend" }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

name: release

# Cuts releases for two channels:
#   * push to the default branch  → a rolling PRERELEASE (tag `v0.0.0`, moved to HEAD)
#   * push of a  v*.*.*  tag       → a normal versioned release
# Each release carries the arm64 .dmg and .pkg installers.
#
# Signing/notarization happens only when the Apple secrets are present; otherwise
# the run falls back to an adhoc build (SANDBOXFS_ADHOC=1) so PRs and forks still
# produce artifacts (NOT Gatekeeper-distributable — see packaging/package.sh).
#
# Required secrets for a real, notarized release:
#   APPLE_CERT_P12_BASE64            base64 of the "Developer ID Application" .p12
#   APPLE_CERT_PASSWORD             its export password
#   APPLE_INSTALLER_CERT_P12_BASE64  base64 of the "Developer ID Installer" .p12
#   APPLE_INSTALLER_CERT_PASSWORD   its export password
#   APPLE_DEVID_APP                 e.g. "Developer ID Application: NAME (TEAMID)"
#   APPLE_DEVID_INSTALLER          e.g. "Developer ID Installer: NAME (TEAMID)"
#   APPLE_TEAM_ID                  10-char team id
#   APPLE_NOTARY_APPLE_ID          Apple ID email for notarytool
#   APPLE_NOTARY_PASSWORD          app-specific password for that Apple ID

# PAUSED: fskit-appex needs the macOS 27 beta SDK (Xcode 27), which GitHub-hosted
# runners don't ship yet — the archive fails with "cannot find 'FSActivateResult'".
# Until a hosted image carries Xcode 27, cut releases from a Mac with the beta SDK
# using packaging/release-local.sh. To revive CI: uncomment the push/tag triggers
# below (and, if still needed, point runs-on at a self-hosted runner).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # macOS 26 runner: the app targets MACOSX_DEPLOYMENT_TARGET 26.4 and uses
    # FSKit APIs that only exist in the 26.4 SDK. Anything older cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Compute release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "channel=tag"           >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}"      >> "$GITHUB_OUTPUT"
          else
            SHORT="$(git rev-parse --short HEAD)"
            echo "channel=rolling"                >> "$GITHUB_OUTPUT"
            echo "tag=v0.0.0"                     >> "$GITHUB_OUTPUT"
            echo "version=0.0.0"                  >> "$GITHUB_OUTPUT"
          fi

      - name: Configure signing
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "adhoc=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Apple signing secrets — building adhoc (not distributable)."
            echo "adhoc=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificates and notary profile
        if: steps.signing.outputs.adhoc == '0'
        env:
          APP_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          INST_CERT: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          INST_CERT_PW: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="ci-$RANDOM"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$APP_CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          echo "$INST_CERT" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          security import "$RUNNER_TEMP/inst.p12" -k "$KEYCHAIN" -P "$INST_CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/productbuild

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Make our keychain searchable alongside the login/system ones.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')

          # Store the notary credentials under the profile package.sh expects.
          xcrun notarytool store-credentials sandboxfs-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN"

      - name: Package (.pkg + .dmg)
        env:
          SANDBOXFS_ADHOC: ${{ steps.signing.outputs.adhoc }}
          SANDBOXFS_VERSION: ${{ steps.meta.outputs.version }}
          SANDBOXFS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SANDBOXFS_DEVID_APP: ${{ secrets.APPLE_DEVID_APP }}
          SANDBOXFS_DEVID_INSTALLER: ${{ secrets.APPLE_DEVID_INSTALLER }}
          SANDBOXFS_NOTARY_PROFILE: sandboxfs-notary
        run: ./packaging/package.sh

      - name: Collect artifacts
        id: collect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "dist/sandboxfs-$VERSION.dmg"      "out/sandboxfs-$VERSION-arm64.dmg"
          cp "dist/sandbox-$VERSION.pkg"        "out/sandboxfs-$VERSION-arm64.pkg"
          ( cd out && shasum -a 256 * > SHA256SUMS.txt )
          ls -la out

      - name: Publish rolling prerelease
        if: steps.meta.outputs.channel == 'rolling'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-cut the moving v0.0.0 prerelease at this commit.
          gh release delete v0.0.0 --cleanup-tag --yes || true
          gh release create v0.0.0 out/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "sandboxfs-0.0.0" \
            --notes-file packaging/release-notes.md

      - name: Publish tagged release
        if: steps.meta.outputs.channel == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* \
            --title "$TAG" \
            --notes-file packaging/release-notes.md

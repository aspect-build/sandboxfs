name: bench
description: >
  One cold benchmark sample of a Bazel build under a single spawn strategy.
  Fetches (--nobuild) untimed, then times the action-execution build so network
  fetches never enter the measured number.

inputs:
  sandbox:
    description: darwin-sandbox | sandboxfs
    required: true
  target:
    description: Bazel target to build in the workload repo
    required: true
  workload-repo:
    description: owner/name of the repo to build as the workload
    required: true
  workload-ref:
    description: git ref of the workload repo
    required: true
  bazel-version:
    description: bazelisk USE_BAZEL_VERSION for the sandboxfs-compatible fork
    required: true
  public-base:
    description: R2 public base URL (no trailing slash), source of the fork + sandboxfs pkg
    required: true
  run-index:
    description: repetition number, for the artifact name
    required: true

runs:
  using: composite
  steps:
    - name: Checkout workload
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.workload-repo }}
        ref: ${{ inputs.workload-ref }}
        path: workload
        fetch-depth: 1

    - name: Setup Bazel with fetch caching
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
        external-cache: true
        disk-cache: false

    - name: Install sandboxfs
      if: inputs.sandbox == 'sandboxfs'
      shell: bash
      env:
        PUBLIC_BASE: ${{ inputs.public-base }}
      run: |
        set -euo pipefail
        base="${PUBLIC_BASE%/}"
        case "$base" in http://*|https://*) ;; *) base="https://$base" ;; esac
        curl -fsSL "$base/releases/v0.0.0/sandboxfs-0.0.0-arm64.pkg" -o "$RUNNER_TEMP/sandboxfs.pkg"
        # The signed .pkg's distribution XML hard-requires macOS 26.4, so `installer`
        # refuses on macos-15. Lay the signed CLI down straight from the payload.
        pkgutil --expand-full "$RUNNER_TEMP/sandboxfs.pkg" "$RUNNER_TEMP/sfs-pkg"
        cli="$(find "$RUNNER_TEMP/sfs-pkg" -type f -name sandboxfs -perm -111 | head -1)"
        test -n "$cli"
        sudo install -m 0755 "$cli" /usr/local/bin/sandboxfs
        xattr -dr com.apple.quarantine /usr/local/bin/sandboxfs 2>/dev/null || true
        # No --version subcommand; the usage banner proves the binary loaded (dyld) on this OS.
        out="$(/usr/local/bin/sandboxfs 2>&1 || true)"
        echo "$out"
        echo "$out" | grep -q 'usage: sandboxfs'

    - name: Fetch (untimed)
      shell: bash
      working-directory: workload
      env:
        BAZELISK_BASE_URL: ${{ inputs.public-base }}/bazel
        USE_BAZEL_VERSION: ${{ inputs.bazel-version }}
      run: |
        set -euo pipefail
        case "$BAZELISK_BASE_URL" in http://*|https://*) ;; *) BAZELISK_BASE_URL="https://$BAZELISK_BASE_URL" ;; esac
        export BAZELISK_BASE_URL
        bazel version
        bazel build "${{ inputs.target }}" --nobuild --color=no --curses=no

    - name: Build (timed)
      id: build
      shell: bash
      working-directory: workload
      env:
        BAZELISK_BASE_URL: ${{ inputs.public-base }}/bazel
        USE_BAZEL_VERSION: ${{ inputs.bazel-version }}
      run: |
        set -euo pipefail
        case "$BAZELISK_BASE_URL" in http://*|https://*) ;; *) BAZELISK_BASE_URL="https://$BAZELISK_BASE_URL" ;; esac
        export BAZELISK_BASE_URL
        # worker stays first so worker-eligible actions keep running as persistent
        # workers; only sandboxable actions get the swapped backend.
        case "${{ inputs.sandbox }}" in
          darwin-sandbox) strat="--spawn_strategy=worker,sandboxed,local" ;;
          sandboxfs)      strat="--sandbox_backend=aspect-sandbox=sandboxfs --spawn_strategy=worker,aspect-sandbox,local" ;;
          *) echo "::error::unknown sandbox '${{ inputs.sandbox }}'"; exit 1 ;;
        esac
        bazel build "${{ inputs.target }}" $strat --color=no --curses=no \
          --profile="$RUNNER_TEMP/profile.json.gz" 2>&1 | tee "$RUNNER_TEMP/build.log"
        elapsed="$(grep -oE 'Elapsed time: [0-9.]+s' "$RUNNER_TEMP/build.log" | grep -oE '[0-9.]+' | head -1 || true)"
        test -n "$elapsed"
        echo "elapsed_s=$elapsed" >> "$GITHUB_OUTPUT"

    - name: Dump sandbox pool state on failure
      if: ${{ failure() && inputs.sandbox == 'sandboxfs' }}
      shell: bash
      run: |
        set +e
        pool="$HOME/.sandboxfs/pool"
        out="$RUNNER_TEMP/pool-state.txt"
        # An action's open(output) returning EPERM ("Operation not permitted") comes from a BSD
        # flag, ACL, or ownership obstruction that set_writable's 0o200-mode-bit-only check can't
        # see; EACCES comes from the mode bits. Capture all of perms/flags/ACL/owner to tell them
        # apart. %Sf = symbolic flags (uchg/schg/restricted/-).
        stfmt='%Sp flags=%Sf own=%u:%g  %N'
        {
          echo "== who am I / daemon owner =="; id; ps -Ao user,pid,comm | grep -i sandboxfs
          echo; echo "== pool tree (ws-key/slot layout), 3 levels =="
          find "$pool" -maxdepth 3 -exec stat -f "$stfmt" {} + 2>/dev/null
          echo; echo "== zlib exec-config _objs dir, everywhere in the pool (slot copies AND .cas/.rootcas sources) =="
          find "$pool" -type d -path '*macos_x86_64-opt-exec*/bin/external/zlib+/_objs*' 2>/dev/null \
          | while read -r d; do echo "--- $d ---"; ls -leO@ "$d"; stat -f "$stfmt" "$d"; done
          echo; echo "== failing output paths from build log -> ancestor chain per slot =="
          grep -oE "bazel-out/[^ '\")]*\.(o|jdeps|jar)" "$RUNNER_TEMP/build.log" | sort -u | head -8 \
          | while read -r rel; do
              dir="$(dirname "$rel")"                       # leaf isn't created; walk its parent chain
              for root in "$pool"/*/*/root; do
                [ -d "$root" ] || continue
                hit="$(find "$root" -type d -path "*/$dir" 2>/dev/null | head -1)"
                [ -n "$hit" ] || continue
                echo "--- root=$root rel=$dir ---"
                p="$hit"
                while [ "$p" != "$root" ] && [ "$p" != "/" ]; do
                  stat -f "$stfmt" "$p"; ls -led "$p" | sed -n '2,$p'
                  p="$(dirname "$p")"
                done
              done
            done
        } > "$out" 2>&1
        echo "wrote $out ($(wc -l <"$out") lines)"

    - name: Upload pool state on failure
      if: ${{ failure() && inputs.sandbox == 'sandboxfs' }}
      uses: actions/upload-artifact@v4
      with:
        name: pool-state-${{ inputs.sandbox }}-${{ inputs.run-index }}
        path: |
          ${{ runner.temp }}/pool-state.txt
          ${{ runner.temp }}/build.log

    - name: Profile breakdown
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/profile_summary.py" \
          "$RUNNER_TEMP/profile.json.gz" \
          "${{ inputs.sandbox }}" "${{ inputs.run-index }}" \
          "${{ steps.build.outputs.elapsed_s }}" \
          "$RUNNER_TEMP/result.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload sample
      uses: actions/upload-artifact@v4
      with:
        name: bench-${{ inputs.sandbox }}-${{ inputs.run-index }}
        path: |
          ${{ runner.temp }}/result.json
          ${{ runner.temp }}/profile.json.gz

[workspace]
members = ["crates/*"]
# cfs-bin links the private projection backend; keeping it out of the workspace is what keeps an
# ordinary build here from resolving (and fetching) that dependency. See cfs-bin/Cargo.toml.
exclude = ["cfs-bin"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"   # hand no function names to a reverser; highest-value, lowest-effort
